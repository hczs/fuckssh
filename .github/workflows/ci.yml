name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FUCKSSH_LANG: en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go mod verify
      - run: go test -race -cover ./...
      - name: Smoke-test installer from 32-bit Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $powershell32 = Join-Path $env:WINDIR "SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          $binDir = Join-Path $env:RUNNER_TEMP "fuckssh-installer-test"
          # 使用已发布版本测试当前安装脚本，避免 PR 阶段依赖尚不存在的发布包。
          & $powershell32 -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1 -Version v0.6.0 -BinDir $binDir
          if ($LASTEXITCODE -ne 0) { throw "32-bit PowerShell installer smoke test failed" }
          & (Join-Path $binDir "fuckssh.exe") version
          if ($LASTEXITCODE -ne 0) { throw "installed fuckssh binary failed to run" }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build -o fuckssh${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/fuckssh
